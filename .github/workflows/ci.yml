name: Rust checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup update stable --no-self-update
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked -p tdn-credit
      - run: target/release/tdn-credit --headless --seed 1919
      - name: Full local-server replay
        run: |
          mkdir -p /tmp/tdn-credit-ci
          cd /tmp/tdn-credit-ci
          "$GITHUB_WORKSPACE/target/release/tdn-credit" --portable --no-open --port 3137 >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3137/ >/dev/null; then break; fi
            sleep 1
          done
          python3 "$GITHUB_WORKSPACE/scripts/http-smoke.py" http://127.0.0.1:3137
  # Platform order is deliberate: failures prevent later-platform release checks.
  openbsd:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          mem: 4096
          prepare: pkg_add rust python3
          run: |
            set -eu
            export CARGO_BUILD_JOBS=2
            rustc --version
            cargo test --workspace --locked
            cargo build --release --locked -p tdn-credit
            ./target/release/tdn-credit --headless
  macos:
    needs: openbsd
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p tdn-credit
  android-core:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add aarch64-linux-android
      - run: cargo check --locked -p credit-core --target aarch64-linux-android
      # Core check is not APK/runtime certification. See docs/platforms.md.
  windows:
    needs: android-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p tdn-credit
