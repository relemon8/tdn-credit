[workspace]
members = ["crates/*", "app"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rand_chacha = { version = "0.3.1", features = ["serde1"] }
rand_core = "0.6.4"
blake3 = { version = "1", features = ["pure"] }
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
